<style>

    --ink-dim: #242a24;
    --ink-mute: #3a423a;
    --gold: #8a6a28;
    --gold-2: #9a7a34;
    --line: rgba(12, 16, 12, 0.20);
    --now: #8a6a28;
    --danger: #a04838;
    --ok: #3d7a40;

  html, body {

  body {

  .board {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(17rem, 0.72fr) minmax(0, 1.48fr);
    grid-template-rows: auto minmax(0, 0.72fr) minmax(0, 1.28fr);
    grid-template-areas:

      "weather today"

    padding: 1.8vh 2.2vw 1.4vh;
    gap: 1.35vh 1.8vw;

  header {

    justify-content: space-between;
    min-height: 5.6vh;
    gap: 0.8rem;

  .brand .name {

    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.05;

  .brand .school {

    font-size: 1.08rem;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .bus {

    align-items: center;
    gap: 0.85rem;
    margin-left: auto;
    margin-right: 1.0rem;
    padding: 0.28rem 0.85rem 0.32rem;
    border-radius: 0.7rem;
    background: rgba(18,22,18,0.10);
    border: 1px solid var(--line);

  .bus .bus-leg {

    align-items: baseline;
    gap: 0.55rem;
    min-width: 0;

  .bus .bus-label {

  }
  .bus .bus-sep {

  .bus .bus-times {
    display: flex;
    align-items: center;
    gap: 0.32rem;
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ink);
  }
  .bus .bus-times .t {
    font-weight: 800;
    padding: 0.08rem 0.2rem;
  }
  .bus .bus-times .t.gone {
    opacity: 0.34;
    font-weight: 700;
  }
  .bus .bus-times .t.next {
    background: linear-gradient(135deg, #c45c3e 0%, #b47a28 100%);
    color: #fffaf4;
    border-radius: 0.55rem;
    padding: 0.12rem 0.5rem 0.14rem;
    box-shadow: 0 0.28rem 0.9rem rgba(196, 92, 62, 0.28);
    font-weight: 800;
  }
  .bus .bus-times .t.ret {
    font-size: 1.02rem;
  }
  .head-status {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 0.86rem;
    color: var(--ink-mute);
    letter-spacing: 0.08em;
    flex: none;
  }
  .dot {
    width: 0.55rem; height: 0.55rem; border-radius: 50%;
    background: var(--ink-mute);
    box-shadow: 0 0 0 0.22rem rgba(143,186,122,0.08);
  }
  .dot.live { background: var(--ok); }
  .dot.cache { background: var(--gold); }
  .dot.off { background: var(--danger); }

  .weather, .today, .todos {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 1.1rem;
    box-shadow: 0 0.35rem 1.2rem rgba(42, 36, 29, 0.06);
  }
  .weather {
    grid-area: weather;
    padding: 1rem 1.15rem 0.9rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .clock-row {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    line-height: 0.85;
    width: fit-content;
    max-width: 100%;
    border-radius: 0.9rem;
    padding: 0.15rem 0.2rem;
    transition: background 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
  }
  .clock-row.is-bus-soon {
    background: linear-gradient(135deg, #c45c3e 0%, #b47a28 100%);
    color: #fffaf4;
    padding: 0.35rem 0.85rem 0.4rem;
    box-shadow: 0 0.45rem 1.4rem rgba(196, 92, 62, 0.28);
  }
  .clock-row.is-bus-soon #clock-hm,
  .clock-row.is-bus-soon #clock-sec {
    color: #fffaf4;
  }
  #clock-hm {
    font-size: 4.15rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    font-family: "Roboto", "Noto Sans", system-ui, sans-serif;
  }
  #clock-sec {
    font-size: 2.1rem;
    font-weight: 400;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }
  .date-main {
    margin-top: 0.55rem;
    font-size: 1.28rem;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
  }
  .date-sub {
    margin-top: 0.15rem;
    font-size: 0.92rem;
    color: var(--ink-mute);
    letter-spacing: 0.12em;
    text-transform: lowercase;
  }
  .wx {
    margin-top: 1.1rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
  #w-icon { width: 4.1rem; height: 4.1rem; color: var(--gold); }
  #w-icon svg { width: 100%; height: 100%; display: block; }
  #temp {
    font-size: 4.6rem;
    font-weight: 300;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
  }
  #temp span { font-size: 0.4em; color: var(--ink-dim); margin-left: 0.05em; }
  #w-label {
    font-size: 1.85rem;
    font-weight: 650;
    letter-spacing: 0.1em;

  .wx .rain {

    font-size: 1.18rem;
    font-weight: 650;
    letter-spacing: 0.06em;
    padding: 0.3rem 0.9rem 0.34rem;
    border-radius: 0.7rem;
    background: rgba(42,36,29,0.06);
    color: var(--ink-dim);
  }
  .wx .rain.is-wet {
    background: rgba(61,138,160,0.16);
    color: var(--rain);
    box-shadow: inset 0 0 0 1px rgba(61,138,160,0.35);
  }

  .today {
    grid-area: today;
    padding: 1.15rem 1.45rem 1.1rem;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: inset 0 0 0 1px rgba(180,122,40,0.06);
  }
  .today-head {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 1rem;
    margin-bottom: 0.25rem;
  }
  .today-kicker {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    color: var(--gold);
    font-weight: 600;
  }
  .dismiss {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 0.55rem;
    flex: none;
    width: 100%;
    background: linear-gradient(135deg, #c45c3e 0%, #b47a28 100%);
    color: #fffaf4;
    padding: 0.45rem 1.1rem 0.5rem;
    border-radius: 0.9rem;
    box-shadow: 0 0.45rem 1.4rem rgba(196, 92, 62, 0.28);
  }
  .dismiss .lbl {
    font-size: 0.82rem;
    letter-spacing: 0.16em;
    font-weight: 700;
    opacity: 0.92;
    white-space: nowrap;
  }
  .dismiss .t {
    font-size: 2.2rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .dismiss .hint {
    font-size: 0.78rem;
    opacity: 0.88;
    letter-spacing: 0.04em;
  }
  .nowline {
    margin: 0.08rem 0 0.22rem;
    font-size: 0.98rem;
    color: var(--ink-dim);
    min-height: 1.15rem;
  }
  .nowline b { color: var(--ink); font-weight: 750; }
  .nowline .tag { color: var(--gold); font-weight: 700; letter-spacing: 0.12em; margin-right: 0.45rem; }

  .timeline {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.26rem;
  }
  .period {
    display: grid;
    grid-template-columns: 10.2rem minmax(0, 1fr) auto;
    gap: 0.7rem;
    align-items: center;
    overflow: hidden;
    padding: 0.22rem 0.85rem 0.22rem 0.75rem;
    border-radius: 0.62rem;
    background: rgba(18,22,18,0.08);
    border-left: 0.38rem solid var(--c, var(--ink-mute));
    flex: 1 1 0;
    min-height: 0;
  }
  .period.is-past { opacity: 0.62; }
  .period.is-now {
    background: rgba(180,122,40,0.12);
    box-shadow: 0 0 0 1px rgba(180,122,40,0.32);
    animation: glow 2.6s ease-in-out infinite;
  }
  .period.is-next { box-shadow: inset 0 0 0 1px rgba(180,122,40,0.28); }

    border-left-color: transparent;

    flex: 0.3;
    padding-top: 0.18rem;
    padding-bottom: 0.18rem;
  }

  .period .when {
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    gap: 0.26rem;
  }
  .period .when .start {
    font-size: 1.05rem;
    color: var(--ink-dim);
    font-weight: 600;
  }
  .period .when .sep { color: var(--ink-mute); font-weight: 500; }
  .period .when .end {
    font-size: 1.05rem;
    font-weight: 750;
    color: var(--gold);
    line-height: 1;
  }
  .period .when .end i {
    display: none;
    font-style: normal;
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    color: var(--ink-mute);
    font-weight: 700;
    margin-bottom: 0.08rem;
  }
  .period .fr {
    font-size: 1.38rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .period .fr .zh {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink-mute);
    margin-left: 0.5rem;
    letter-spacing: 0.02em;

    font-size: 0.78rem;
    color: var(--gold);
    letter-spacing: 0.04em;
    text-align: right;
    max-width: 9.5rem;
  }
  .badge {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    border: 1px solid rgba(180,122,40,0.45);
    border-radius: 999px;
    padding: 0.12rem 0.45rem;
    white-space: nowrap;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(180,122,40,0.32); }
    50% { box-shadow: 0 0 1.1rem 0 rgba(180,122,40,0.16); }

    grid-area: todos;
    background: linear-gradient(165deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 1.1rem;
    padding: 0.85rem 1.0rem 0.9rem;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);

    justify-content: space-between;

  .todos-sub {

    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.06em;
  }
  .tm-compact {
    flex-shrink: 0;
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--ink-dim);
    padding: 0.28rem 0.45rem;
    margin-bottom: 0.45rem;
    border-radius: 0.45rem;
    background: rgba(18,22,18,0.08);
    border: 1px solid var(--line);

  .tm-compact b { color: var(--gold); font-weight: 800; }
  .todos-scroll {

    min-height: 0;
    overflow: auto;
    padding-right: 0.2rem;
  }
  .todos-group {
    margin-bottom: 0.55rem;
  }
  .todos-group:last-child { margin-bottom: 0; }
  .todos-group-title {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--gold);
    margin: 0.15rem 0 0.28rem;
  }
  .todo-row {
    display: grid;
    grid-template-columns: 5.4rem minmax(0, 1fr);
    gap: 0.35rem 0.55rem;
    padding: 0.32rem 0.2rem;
    border-bottom: 1px solid rgba(12,16,12,0.12);
    align-items: start;
  }
  .todo-row:last-child { border-bottom: none; }
  .todo-when {
    font-size: 1.02rem;
    font-weight: 800;
    color: var(--danger);
    letter-spacing: 0.02em;
    line-height: 1.25;
  }
  .todo-text {
    font-size: 1.12rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.28;
  }
  .todo-row.is-soon .todo-when { color: var(--danger); }
  .todo-row.is-later .todo-when { color: var(--ink-dim); }
  .todo-empty {
    color: var(--ink-mute);
    font-size: 1.1rem;
    padding: 0.4rem 0.1rem;
  }

  .empty { color: var(--ink-mute); font-size: 1.1rem; padding: 0.4rem 0; }
</style>

  let schedule = FALLBACK_SCHEDULE;
  let lastPhase = "";

  function parisParts(d) {
    const f = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ,
      weekday: "short",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });
    const o = {};
    for (const { type, value } of f.formatToParts(d || new Date())) {
      if (type !== "literal") o[type] = value;
    }
    o.dow = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[o.weekday];
    o.hhmm = o.hour + ":" + o.minute;
    return o;
  }

  function toMin(hhmm) {
    const p = String(hhmm).split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function gapMin(a, b) { return toMin(b) - toMin(a); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function slotMap() {
    const m = {};
    (schedule.slots || []).forEach(function (s) { m[s.id] = s; });
    return m;
  }
  function subj(id) {
    return (schedule.subjects && schedule.subjects[id]) || { fr: id, zh: "", abbr: id, color: "#8a7868" };
  }

  function isoWeekParityFromParts(p) {
    // ISO week number for the Paris Y-M-D in p.
    const date = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)));
    const day = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    return (week % 2 === 0) ? "even" : "odd";
  }

  function parityLabel(parity) {
    const meta = (schedule.weekParity && schedule.weekParity[parity]) || {};
    return (meta.zh || parity) + " · " + (meta.colorZh || "");
  }

  function partsForDow(base, targetDow) {
    // Shift base Paris date to the given weekday (0=Sun..6=Sat) within the same Mon–Sun week,
    // or to next Monday when target is next school day across weekend.
    const baseDate = new Date(Date.UTC(Number(base.year), Number(base.month) - 1, Number(base.day)));
    let delta = targetDow - base.dow;
    const d = new Date(baseDate);
    d.setUTCDate(d.getUTCDate() + delta);
    return {
      year: String(d.getUTCFullYear()),
      month: pad2(d.getUTCMonth() + 1),
      day: pad2(d.getUTCDate()),
      dow: targetDow
    };
  }

  function dayRaw(dayNum, parity) {
    const key = String(dayNum);
    if (dayNum === 4 || dayNum === 5) {
      const pack = parity === "even" ? schedule.daysEven : schedule.daysOdd;
      if (pack && pack[key]) return pack[key];
    }
    return (schedule.days && schedule.days[key]) || [];
  }

  function dayLessons(dayNum, parity) {
    if (!parity) parity = currentParity || isoWeekParityFromParts(parisParts());
    const slots = slotMap();
    const raw = dayRaw(dayNum, parity);
    const maxGap = schedule.mergeMaxGapMinutes || 20;
    const items = [];
    raw.forEach(function (L) {
      const sl = slots[L.slot];
      if (!sl) return;
      items.push({
        type: "class",
        start: sl.start,
        end: sl.end,
        subject: L.subject,
        room: L.room || ""
      });
    });
    const merged = [];
    items.forEach(function (L) {
      const p = merged[merged.length - 1];
      if (p && p.subject === L.subject && (p.room || "") === (L.room || "") && gapMin(p.end, L.start) <= maxGap) {
        p.end = L.end;
      } else {
        merged.push(Object.assign({}, L));
      }
    });
    return merged;
  }

  function dayTimeline(dayNum) {
    const merged = dayLessons(dayNum);
    const lunch = (schedule.slots || []).find(function (s) { return s.type === "lunch"; });
    const hasAfternoon = merged.some(function (L) { return L.start >= "12:00"; });
    let items = merged.slice();
    if (hasAfternoon && lunch) {
      const before = merged.filter(function (L) { return L.start < lunch.start; });
      const after = merged.filter(function (L) { return L.start >= lunch.start; });
      items = before.concat([{
        type: "lunch",
        start: lunch.start,
        end: lunch.end,
        fr: lunch.fr,
        zh: lunch.zh
      }]).concat(after);
    }
    const out = [];
    items.forEach(function (it) {
      if (out.length) {
        const prev = out[out.length - 1];
        const g = gapMin(prev.end, it.start);
        if (g >= 8 && g <= 25 && prev.type === "class" && it.type === "class") {
          out.push({ type: "break", start: prev.end, end: it.start, fr: "RÉCRÉATION", zh: "课间" });
        }
      }
      out.push(it);
    });
    return out;
  }

  function phase(nowHm, dayNum) {
    const items = dayTimeline(dayNum);
    let current = null, next = null;
    const t = toMin(nowHm);
    items.forEach(function (it) {
      if (it.type === "break") return;
      const a = toMin(it.start), b = toMin(it.end);
      if (t >= a && t < b) current = it;
      if (it.type === "class" && t < a && !next) next = it;
    });
    if (next && current && next.start === current.start) next = null;
    return { current: current, next: next, items: items };
  }

  function remainLabel(it, nowHm, kind) {
    const t = toMin(nowHm);
    if (!it) return "";
    if (kind === "now") {
      const m = Math.max(0, toMin(it.end) - t);
      return "还剩 " + m + " 分钟";
    }
    const m = Math.max(0, toMin(it.start) - t);
    if (m >= 60) return "还有 " + Math.floor(m / 60) + " 小时 " + (m % 60) + " 分钟";
    return "还有 " + m + " 分钟";
  }

  function nextBusMm(nowHm) {
    const now = toMin(nowHm);
    let next = null;
    BUS_T1_7.forEach(function (mm) {
      const t = toMin("07:" + mm);
      if (next == null && now < t) next = mm;
    });
    return next;
  }

  function allReturnTrips() {
    const out = [];
    Object.keys(BUS_T1_RET).map(Number).sort(function (a, b) { return a - b; }).forEach(function (h) {
      BUS_T1_RET[h].forEach(function (mm) {
        out.push({ h: h, mm: mm, hm: pad2(h) + ":" + mm, min: h * 60 + Number(mm) });
      });
    });
    return out;
  }

  // After today's last bell: next 3 return trips, first at least +20 minutes.
  // e.g. dismiss 14:50 → earliest 15:10 → 15:11 15:26 15:41
  function returnTripsAfterDismiss(dow) {
    const end = lastBell(dow, currentParity);
    if (!end) return { hour: null, trips: [] };
    const earliest = toMin(end) + 20;
    const trips = allReturnTrips().filter(function (tr) { return tr.min >= earliest; }).slice(0, 3);
    const hour = trips.length ? trips[0].h : null;
    return { hour: hour, trips: trips, dismiss: end };
  }

  function renderBus(nowHm, dow) {
    const el = document.getElementById("bus-times");
    const retEl = document.getElementById("bus-ret-times");
    const retLabel = document.getElementById("bus-ret-label");
    if (!el) return;
    const now = toMin(nowHm);
    const next = nextBusMm(nowHm);
    el.innerHTML = BUS_T1_7.map(function (mm) {
      const t = toMin("07:" + mm);
      const gone = now >= t;
      const isNext = mm === next;
      let cls = "t";
      if (gone) cls += " gone";
      if (isNext) cls += " next";
      return '<span class="' + cls + '">07:' + mm + "</span>";
    }).join("");

    if (!retEl) return;
    const d = (dow >= 1 && dow <= 5) ? dow : 1;
    const pack = returnTripsAfterDismiss(d);
    if (retLabel) {
      retLabel.textContent = "返 · T1";
    }
    if (!pack.trips.length) {
      retEl.innerHTML = '<span class="t gone">—</span>';
      return;
    }
    let nextRet = null;
    pack.trips.forEach(function (tr) {
      if (nextRet == null && now < tr.min) nextRet = tr.hm;
    });
    retEl.innerHTML = pack.trips.map(function (tr) {
      let cls = "t ret";
      if (now >= tr.min) cls += " gone";
      if (tr.hm === nextRet) cls += " next";
      return '<span class="' + cls + '">' + tr.hm + "</span>";
    }).join("");
  }

  function renderClock() {
    const p = parisParts();
    const hmEl = document.getElementById("clock-hm");
    const secEl = document.getElementById("clock-sec");
    const row = document.querySelector(".clock-row");
    hmEl.textContent = p.hour + ":" + p.minute;
    secEl.textContent = p.second;
    const y = p.year, m = Number(p.month), d = Number(p.day);
    document.getElementById("date-main").textContent =
      y + "年" + m + "月" + d + "日  ·  " + ZH_WD[p.dow];
    document.getElementById("date-sub").textContent =
      FR_WD[p.dow] + "  " + d + " " + FR_MO[m - 1] + "  " + y;
    // Within 15 minutes before the next T1 departure, match the dismiss badge style.
    if (row) {
      const next = nextBusMm(p.hhmm);
      let soon = false;
      if (next != null) {
        const left = toMin("07:" + next) - toMin(p.hhmm);
        soon = left > 0 && left <= 15;
      }
      row.classList.toggle("is-bus-soon", soon);
    }
  }

  function blockTitle(it) {
    if (it.type === "lunch") return { fr: it.fr || "PAUSE DÉJEUNER", zh: it.zh || "午休", color: "#6a6058", room: "" };
    if (it.type === "break") return { fr: it.fr || "RÉCRÉATION", zh: it.zh || "课间", color: "#6a6058", room: "" };
    if (it.type === "extra") return { fr: it.fr || "", zh: it.zh || "", color: it.color || "#4a6b5c", room: "" };
    const s = subj(it.subject);
    return { fr: s.fr, zh: s.zh, color: s.color, room: it.room || "", official: s.official || "" };
  }

  function lastBell(dow, parity) {
    const lessons = dayLessons(dow, parity);
    if (!lessons.length) return null;
    return lessons[lessons.length - 1].end;
  }

  function renderDismiss(nowHm, dow, parity) {
    const el = document.getElementById("dismiss");
    if (!el) return;
    let d = dow, label = "今天下课", hint = "";
    let par = parity;
    if (dow === 0 || dow === 6) {
      d = 1; label = "周一放学"; hint = "周末";
      const mon = partsForDow(parisParts(), 1);
      // if today Sat/Sun, Monday is next week → shift +1 or +2 days from Sun/Sat
      const base = parisParts();
      const baseDate = new Date(Date.UTC(Number(base.year), Number(base.month) - 1, Number(base.day)));
      const add = dow === 6 ? 2 : 1;
      baseDate.setUTCDate(baseDate.getUTCDate() + add);
      par = isoWeekParityFromParts({
        year: String(baseDate.getUTCFullYear()),
        month: pad2(baseDate.getUTCMonth() + 1),
        day: pad2(baseDate.getUTCDate())
      });
    }
    const end = lastBell(d, par);
    if (!end) {
      el.innerHTML = '<div class="lbl">下课</div><div class="t">—</div>';
      return;
    }
    if (dow >= 1 && dow <= 5 && toMin(nowHm) >= toMin(end)) {
      label = "已放学";
      hint = end;
    }
    el.innerHTML =
      '<div class="lbl">' + esc(label) + '</div>' +
      '<div class="t">' + esc(end) + '</div>' +
      (hint && hint !== end ? '<div class="hint">' + esc(hint) + '</div>' : '');
  }


  function ymdFromParts(p) {
    return p.year + "-" + p.month + "-" + p.day;
  }

  function ymdForNextSchoolDay(dow) {
    const base = parisParts();
    let add = 1;
    if (dow === 5) add = 3;
    else if (dow === 6) add = 2;
    else if (dow === 0) add = 1;
    const d = new Date(Date.UTC(Number(base.year), Number(base.month) - 1, Number(base.day)));
    d.setUTCDate(d.getUTCDate() + add);
    return String(d.getUTCFullYear()) + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }

  function afterSchoolItems(dayNum, ymd) {
    const pack = schedule.afterSchool;
    if (!pack || !pack.byDow) return [];
    if (pack.from && ymd && ymd < pack.from) return [];
    const list = pack.byDow[String(dayNum)] || [];
    return list.map(function (L) {
      return {
        type: "extra",
        start: L.start,
        end: L.end,
        fr: L.fr || "",
        zh: L.zh || "",
        color: L.color || "#4a6b5c",
        room: ""
      };
    });
  }

  function rawDay(dayNum, parity) {
    if (!parity) parity = currentParity || isoWeekParityFromParts(parisParts());
    const slots = slotMap();
    const raw = dayRaw(dayNum, parity);
    const out = [];
    raw.forEach(function (L) {
      const sl = slots[L.slot];
      if (!sl) return;
      out.push({
        type: "class",
        start: sl.start,
        end: sl.end,
        subject: L.subject,
        room: L.room || ""
      });
    });
    return out;
  }

  function renderHero(p, nowHm, dow) {
    const el = document.getElementById("hero");
    if (!el) return;
    if (dow === 0 || dow === 6) {
      el.innerHTML = '<span class="tag">周末</span>休息';
      return;
    }
    const classes = rawDay(dow);
    if (!classes.length) { el.textContent = ""; return; }
    const last = classes[classes.length - 1];
    if (toMin(nowHm) >= toMin(last.end)) {
      el.innerHTML = '<span class="tag">已放学</span>';
      return;
    }
    if (p.current && p.current.type === "class") {
      const t = blockTitle(p.current);
      el.innerHTML = '<span class="tag">现在</span><b>' + esc(t.fr) + '</b> · ' +
        esc(remainLabel(p.current, nowHm, "now"));
      return;
    }
    if (p.next) {
      const t = blockTitle(p.next);
      el.innerHTML = '<span class="tag">下一节</span><b>' + esc(t.fr) + '</b> · ' +
        esc(remainLabel(p.next, nowHm, "next"));
      return;
    }
    el.textContent = "";
  }

  function renderKicker(dow, parity) {
    const el = document.getElementById("today-kicker");
    if (!el) return;
    if (dow === 0 || dow === 6) { el.textContent = "周末 · 无课"; return; }
    const n = rawDay(dow, parity).length;
    const pl = parityLabel(parity).replace(" · ", "·");
    el.textContent = "今天 · " + n + " 节课 · " + pl;
  }

  function renderTimeline(p, nowHm, dow) {
    const el = document.getElementById("timeline");
    if (dow === 0 || dow === 6) {
      el.innerHTML = '<div class="empty">周一到周五显示今天的课</div>';
      return;
    }
    const t = toMin(nowHm);
    const items = rawDay(dow).concat(afterSchoolItems(dow, ymdFromParts(parisParts())));
    el.innerHTML = items.map(function (it) {
      const title = blockTitle(it);
      const a = toMin(it.start), b = toMin(it.end);
      let cls = "period";
      if (it.type === "extra") cls += " is-extra";
      if (t >= b) cls += " is-past";
      else if (t >= a && t < b) cls += " is-now";
      else if (p.next && it.start === p.next.start) cls += " is-next";
      const badge = (cls.indexOf("is-now") >= 0)
        ? '<span class="badge">现在</span>'
        : (cls.indexOf("is-next") >= 0 ? '<span class="badge">下一节</span>' : "");
      const room = title.room ? '<div class="room">' + esc(title.room) + "</div>" : badge;
      const zhInline = title.zh ? '<span class="zh">' + esc(title.zh) + "</span>" : "";
      return '<div class="' + cls + '" style="--c:' + esc(title.color) + '">' +
        '<div class="when"><span class="start">' + esc(it.start) + '</span><span class="sep">–</span><span class="end">' + esc(it.end) + "</span></div>" +
        '<div class="fr">' + esc(title.fr) + zhInline + "</div>" +
        (title.room || badge ? room : "<div></div>") +
        "</div>";
    }).join("");
  }

  function nextSchoolDay(dow) {
    if (dow === 5) return 1; // Fri -> Mon
    if (dow === 6) return 1; // Sat -> Mon
    if (dow === 0) return 1; // Sun -> Mon
    return dow + 1;
  }

  function parityForNextSchoolDay(dow) {
    const base = parisParts();
    const n = nextSchoolDay(dow);
    let add = 0;
    if (dow === 5) add = 3; // Fri -> Mon
    else if (dow === 6) add = 2; // Sat -> Mon
    else if (dow === 0) add = 1; // Sun -> Mon
    else add = 1; // tomorrow
    const d = new Date(Date.UTC(Number(base.year), Number(base.month) - 1, Number(base.day)));
    d.setUTCDate(d.getUTCDate() + add);
    return isoWeekParityFromParts({
      year: String(d.getUTCFullYear()),
      month: pad2(d.getUTCMonth() + 1),
      day: pad2(d.getUTCDate())
    });
  }

  function tomorrowLabel(dow) {
    const n = nextSchoolDay(dow);
    const par = parityForNextSchoolDay(dow);
    const pl = parityLabel(par).replace(" · ", "·");
    if (dow === 5 || dow === 6 || dow === 0) return "周一 · " + rawDay(n, par).length + " 节课 · " + pl;
    return "明天 · " + rawDay(n, par).length + " 节课 · " + pl;
  }


  function daysUntil(ymd, todayYmd) {
    if (!ymd || !todayYmd) return 99;
    const a = ymd.split("-").map(Number);
    const b = todayYmd.split("-").map(Number);
    const da = Date.UTC(a[0], a[1] - 1, a[2]);
    const db = Date.UTC(b[0], b[1] - 1, b[2]);
    return Math.round((da - db) / 86400000);
  }

  function activeTodoItems(todayYmd) {
    const pack = schedule.todos;
    if (!pack || !pack.groups) return [];
    const out = [];
    pack.groups.forEach(function (g) {
      const items = [];
      (g.items || []).forEach(function (it) {
        if (it.until && todayYmd && it.until < todayYmd) return;
        items.push(it);
      });
      if (items.length) out.push({ titleZh: g.titleZh || g.id, items: items });
    });
    return out;
  }

  function renderTodos() {
    const el = document.getElementById("todos");
    const countEl = document.getElementById("todos-count");
    if (!el) return;
    const todayYmd = ymdFromParts(parisParts());
    const groups = activeTodoItems(todayYmd);
    let n = 0;
    groups.forEach(function (g) { n += g.items.length; });
    if (countEl) countEl.textContent = n ? (n + " 项") : "";
    if (!n) {
      el.innerHTML = '<div class="todo-empty">暂无待办</div>';
      return;
    }
    el.innerHTML = groups.map(function (g) {
      const rows = g.items.map(function (it) {
        const d = daysUntil(it.until, todayYmd);
        const soon = d <= 3;
        const cls = "todo-row " + (soon ? "is-soon" : "is-later");
        return '<div class="' + cls + '">' +
          '<div class="todo-when">' + esc(it.when || "") + "</div>" +
          '<div class="todo-text">' + esc(it.text || "") + "</div>" +
          "</div>";
      }).join("");
      return '<div class="todos-group"><div class="todos-group-title">' + esc(g.titleZh) + "</div>" + rows + "</div>";
    }).join("");
  }

  function renderWeek(nowHm, dow) {
    const el = document.getElementById("tm-compact");
    const n = nextSchoolDay(dow);
    const par = parityForNextSchoolDay(dow);
    const end = lastBell(n, par);
    const items = rawDay(n, par).concat(afterSchoolItems(n, ymdForNextSchoolDay(dow)));
    if (!el) return;
    if (!items.length) {
      el.innerHTML = esc(tomorrowLabel(dow)) + " · 无课";
      return;
    }
    const names = items.slice(0, 4).map(function (it) {
      const t = blockTitle(it);
      return t.zh || t.fr;
    }).filter(Boolean);
    const more = items.length > 4 ? "…" : "";
    el.innerHTML = esc(tomorrowLabel(dow)) +
      (end ? (" · 下课 <b>" + esc(end) + "</b>") : "") +
      (names.length ? (" · " + esc(names.join("、") + more)) : "");
  }

  function phaseKey() {
    const p = parisParts();
    const ph = (p.dow >= 1 && p.dow <= 5) ? phase(p.hhmm, p.dow) : { current: null, next: null };
    return p.dow + "|" + p.hhmm + "|" + (ph.current ? ph.current.type + ph.current.start : "x") + "|" + (ph.next ? ph.next.start : "y");
  }

  let currentParity = "even";

  function renderSchedule() {
    const p = parisParts();
    currentParity = isoWeekParityFromParts(p);
    const ph = (p.dow >= 1 && p.dow <= 5) ? phase(p.hhmm, p.dow) : { current: null, next: null, items: [] };
    renderDismiss(p.hhmm, p.dow, currentParity);
    renderKicker(p.dow, currentParity);
    renderHero(ph, p.hhmm, p.dow);
    renderTimeline(ph, p.hhmm, p.dow);
    renderWeek(p.hhmm, p.dow);
    renderTodos();
    lastPhase = phaseKey();
  }

  function weatherZh(code) {
    if (code === 0) return "晴";
    if (code === 1) return "大部晴朗";
    if (code === 2) return "多云";
    if (code === 3) return "阴";
    if (code === 45 || code === 48) return "雾";
    if (code >= 51 && code <= 57) return "毛毛雨";
    if (code === 61 || code === 80) return "小雨";
    if (code === 63 || code === 81) return "中雨";
    if (code === 65 || code === 82) return "大雨";
    if (code === 66 || code === 67) return "冻雨";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "雪";
    if (code === 95) return "雷雨";
    if (code === 96 || code === 99) return "雷阵雨";
    return "天气";
  }

  function weatherIcon(code, isDay) {
    const stroke = 'stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
    if (code === 0) {
      return isDay
        ? '<svg viewBox="0 0 64 64" ' + stroke + '><circle cx="32" cy="32" r="12"/><path d="M32 8v6M32 50v6M8 32h6M50 32h6M14 14l4 4M46 46l4 4M14 50l4-4M46 18l4-4"/></svg>'
        : '<svg viewBox="0 0 64 64" ' + stroke + '><path d="M44 40a14 14 0 1 1-12-22 18 18 0 1 0 12 22z"/></svg>';
    }
    if (code === 1 || code === 2) {
      return '<svg viewBox="0 0 64 64" ' + stroke + '><circle cx="24" cy="24" r="9"/><path d="M44 44h-22a10 10 0 1 1 2.4-19.7A13 13 0 0 1 50 38a8 8 0 0 1-6 6z"/></svg>';
    }
    if (code === 3) {
      return '<svg viewBox="0 0 64 64" ' + stroke + '><path d="M46 46H22a12 12 0 1 1 3-23.6A15 15 0 0 1 54 38a9 9 0 0 1-8 8z"/></svg>';
    }
    if (code === 45 || code === 48) {
      return '<svg viewBox="0 0 64 64" ' + stroke + '><path d="M12 28h40M16 36h32M20 44h24"/></svg>';
    }
    if (code >= 71 && code <= 86) {
      return '<svg viewBox="0 0 64 64" ' + stroke + '><path d="M46 34H22a12 12 0 1 1 3-23.6A15 15 0 0 1 54 26a9 9 0 0 1-8 8z"/><path d="M24 44l2 6M32 44l2 6M40 44l2 6"/></svg>';
    }
    if (code >= 95) {
      return '<svg viewBox="0 0 64 64" ' + stroke + '><path d="M46 32H22a12 12 0 1 1 3-23.6A15 15 0 0 1 54 24a9 9 0 0 1-8 8z"/><path d="M30 34l-6 12h8l-4 12 14-16h-8l6-8z"/></svg>';
    }
    return '<svg viewBox="0 0 64 64" ' + stroke + '><path d="M46 32H22a12 12 0 1 1 3-23.6A15 15 0 0 1 54 24a9 9 0 0 1-8 8z"/><path d="M24 42v8M32 42v8M40 42v8"/></svg>';
  }

  function setWxStatus(mode, text) {
    const dot = document.getElementById("wx-dot");
    dot.className = "dot " + (mode || "");
    document.getElementById("wx-status").textContent = text;
  }

  function applyWeather(data, mode) {
    if (!data || !data.current) return;
    const cur = data.current;
    const daily = data.daily || {};
    const code = cur.weather_code;
    document.getElementById("temp").innerHTML = Math.round(cur.temperature_2m) + "<span>°</span>";
    document.getElementById("w-label").textContent = weatherZh(code);
    document.getElementById("w-icon").innerHTML = weatherIcon(code, cur.is_day === 1);

    const rainEl = document.getElementById("rain");
    const pop = (daily.precipitation_probability_max && daily.precipitation_probability_max[0] != null)
      ? Math.round(daily.precipitation_probability_max[0]) : null;
    const mm = (daily.precipitation_sum && daily.precipitation_sum[0] != null)
      ? daily.precipitation_sum[0] : null;
    const rainingNow = cur.precipitation != null && cur.precipitation > 0;
    const wet = rainingNow || (pop != null && pop >= 40) || (mm != null && mm >= 1);
    let text;
    if (rainingNow) text = "正在下雨";
    else if (pop == null) text = "降雨 –";
    else if (wet) text = "今天有雨 " + pop + "%";
    else text = "今天无雨";
    rainEl.textContent = text;
    rainEl.className = "rain" + (wet ? " is-wet" : "");

    const p = parisParts();
    const hh = p.hour + ":" + p.minute;
    if (mode === "live") setWxStatus("live", "天气已更新  " + hh);
    else if (mode === "cache") setWxStatus("cache", "天气缓存  " + hh);
  }

  async function fetchWeather() {
    try {
      const r = await fetch(WEATHER_URL, { cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const data = await r.json();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
      applyWeather(data, "live");
    } catch (err) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) {}
      if (cached && cached.data) {
        applyWeather(cached.data, "cache");
        setWxStatus("cache", "天气离线 · 显示上次");
      } else {
        setWxStatus("off", "天气暂不可用");
        document.getElementById("w-label").textContent = "暂无天气";
        document.getElementById("temp").innerHTML = "–<span>°</span>";
      }
    }
  }

  async function loadSchedule() {
    try {
      const r = await fetch("schedule.json?v=20260910a", { cache: "no-store" });
      if (r.ok) {
        const data = await r.json();
        if (data && data.days) return data;
      }
    } catch (e) {}
    return FALLBACK_SCHEDULE;
  }

  function tick() {
    renderClock();
    renderBus(parisParts().hhmm, parisParts().dow);
    if (phaseKey() !== lastPhase) renderSchedule();
  }

  async function boot() {
    renderClock();
    renderBus(parisParts().hhmm, parisParts().dow);
    setWxStatus("", "正在获取天气…");
    schedule = await loadSchedule();
    renderSchedule();
    renderBus(parisParts().hhmm, parisParts().dow);
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (cached && cached.data) applyWeather(cached.data, "cache");
    } catch (e) {}
    fetchWeather();
    setInterval(tick, 1000);
    setInterval(fetchWeather, WEATHER_MS);
  }

  boot();
})();
</script>
</body>
</html>
